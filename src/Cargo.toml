[package]
name = "hwshare"
version = "1.8.0"
edition = "2021"
description = "华为分享协议实现 —— 同时支持鸿蒙手机 / 鸿蒙 7 与 iPad / iPhone"
license = "GPL-3.0-only"
repository = "https://github.com/SoulLinkIly/HuaweiShare-Windows"
homepage = "https://github.com/SoulLinkIly/HuaweiShare-Windows"
# 两个 bin 显式声明；src/bin/shared/app.rs 只是共享模块，不能自动发现成 bin
autobins = false

[lib]
name = "hwshare"
path = "src/lib.rs"

# 图形界面：GUI 子系统，双击进托盘，不分配控制台
[[bin]]
name = "hwshare"
path = "src/bin/hwshare.rs"

# 命令行：console 子系统，只接 discover/send/serve/listen/--help
[[bin]]
name = "hwshare-cli"
path = "src/bin/hwshare-cli.rs"

[dependencies]
aes-gcm = "0.10"
aes = "0.8"
generic-array = "0.14"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
serde_json = "1"
base64 = "0.22"

# Windows 桌面层：socket 缓冲/keepalive、文件预分配、时区，
# 以及托盘 / 浮层 / 自绘确认框所需的 UI、GDI、Shell、COM。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
